[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "partloom-ai-platform"
version = "0.1.0b1"
description = "Deterministic AI CAD orchestration for desktop CAD connectors"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "pywin32>=306",
  "PySide6>=6.7",
  "openai-agents>=0.18.1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "comtypes>=1.4,<2",
  "pypdf>=5,<7",
  "pdfplumber>=0.11,<1",
]

[tool.setuptools.package-data]
"cad_agent.engineering_knowledge" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
